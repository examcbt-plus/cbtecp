 if(q.t=='tf')return q.i.length?q.i.filter((x,i)=>a[i]===x.v).length/q.i.length:0;
 if(q.t=='isian'){const ks=String(q.ans||'').split(/;|\n/).map(nrm).filter(Boolean);return ks.includes(nrm(a))?1:0}
 const kw=(q.kw||'').toLowerCase().split(',').map(s=>s.trim()).filter(Boolean),t=String(a).toLowerCase();
 return kw.length?kw.filter(k=>t.includes(k)).length/kw.length:0}
const noKey=q=>(q.t=='essay'&&!(q.kw||'').trim())||(q.t=='isian'&&!(q.ans||'').trim());
const wq=(e,q)=>noKey(q)?0:e.ptsMode=='manual'?(q.pts??1):1;
const total=(e,ans)=>{const W=e.qs.reduce((t,q)=>t+wq(e,q),0);return W?Math.round(e.qs.reduce((t,q,i)=>t+sc(q,ans[i])*wq(e,q),0)/W*1000)/10:0};

async function gh(path,opt={}){const r=await fetch('https://api.github.com'+path,{method:opt.method||'GET',body:opt.body,headers:Object.assign({Accept:'application/vnd.github+json',Authorization:'Bearer '+S.cfg.gh.token,'X-GitHub-Api-Version':'2022-11-28'},opt.body?{'content-type':'application/json'}:{})});
 let j=null;try{j=await r.json()}catch(e){}if(!r.ok){const er=new Error((j&&j.message)||('HTTP '+r.status));er.status=r.status;throw er}return j}
const b64=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)};
async function ghPut(path,text,msg,br,raw){const g=S.cfg.gh,u=`/repos/${g.user}/${g.repo}/contents/${path}`;let last;
 for(let t=0;t<4;t++){try{let sha;try{sha=(await gh(u+'?ref='+br)).sha}catch(e){if(e.status!=404)throw e}
  return await gh(u,{method:'PUT',body:JSON.stringify(Object.assign({message:msg,content:raw?text:b64(text),branch:br},sha?{sha}:{}))})}catch(e){last=e;if(e.status==404||e.status==409){await sleep(GHPOLL/3);continue}throw e}}throw last}

async function ghApp(src){
 const g=S.cfg.gh;ghMsg('Memeriksa akun GitHub...');g.user=(await gh('/user')).login;g.repo=(g.repo||slug()).toLowerCase().replace(/[^a-z0-9._-]/g,'')||slug();

 const br=repo.default_branch||'main',base=g.repo.toLowerCase()==g.user.toLowerCase()+'.github.io'?`https://${g.user}.github.io/`:`https://${g.user}.github.io/${g.repo}/`;

 try{await gh(`/repos/${g.user}/${g.repo}/pages`)}catch(e){if(e.status!=404)throw e;try{await gh(`/repos/${g.user}/${g.repo}/pages`,{method:'POST',body:JSON.stringify({source:{branch:br,path:'/'}})})}catch(x){if(x.status!=409)throw x}}
 S.cfg.base=base;sv();return base}

 catch(e){ghMsg('Gagal: '+ghHint(e),'text-red-600');alert('Gagal memperbarui aplikasi: '+ghHint(e))}

function ghHint(e){const m=String(e.message||e);
 if(m==='NEED_SRC')return 'Pilih dulu file index.html aplikasi ini (kolom "File aplikasi" di Pengaturan), lalu klik Publikasikan lagi.';
 if(e.status==401)return 'Token salah atau sudah kedaluwarsa. Buat token baru.';

async function ghPublish(P){

 g.user=(await gh('/user')).login;g.repo=(g.repo||slug()).toLowerCase().replace(/[^a-z0-9._-]/g,'')||slug();
 ghMsg('Menyiapkan repository '+g.repo+'...');let repo;
 try{repo=await gh(`/repos/${g.user}/${g.repo}`)}catch(e){if(e.status!=404)throw e;repo=await gh('/user/repos',{method:'POST',body:JSON.stringify({name:g.repo,description:'EXAM CBT.PLUS - ujian online',private:false,auto_init:true})})}
 const br=repo.default_branch||'main',pageBase=g.repo.toLowerCase()==g.user.toLowerCase()+'.github.io'?`https://${g.user}.github.io/`:`https://${g.user}.github.io/${g.repo}/`;let has=true,hasLogo=true;
 try{await gh(`/repos/${g.user}/${g.repo}/contents/logo.png?ref=${br}`)}catch(e){if(e.status==404)hasLogo=false;else throw e}
 try{await gh(`/repos/${g.user}/${g.repo}/contents/index.html?ref=${br}`)}catch(e){if(e.status==404)has=false;else throw e}
 if(!has){const src=await appSrc();if(!src)throw new Error('NEED_SRC');ghMsg('Mengunggah aplikasi...');await ghPut('index.html',ogFix(src,pageBase),'Tambah aplikasi EXAM CBT.PLUS',br)}
 if(!hasLogo){ghMsg('Mengunggah logo...');await ghPut('logo.png',APP_OG.split(',')[1],'Logo EXAM CBT.PLUS',br,true)}
 ghMsg('Mengunggah data ujian...');await ghPut('data.json',JSON.stringify(P),'Publikasi data ujian',br);
 try{await gh(`/repos/${g.user}/${g.repo}/pages`)}catch(e){if(e.status!=404)throw e;ghMsg('Mengaktifkan GitHub Pages...');try{await gh(`/repos/${g.user}/${g.repo}/pages`,{method:'POST',body:JSON.stringify({source:{branch:br,path:'/'}})})}catch(x){if(x.status!=409)throw x}}
 S.cfg.base=g.repo.toLowerCase()==g.user.toLowerCase()+'.github.io'?`https://${g.user}.github.io/`:`https://${g.user}.github.io/${g.repo}/`;g.last=P.meta.t;sv();
 let live=false;for(let i=0;i<50&&!live;i++){try{const r=await fetch(S.cfg.base+'data.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();live=!!(j.meta&&j.meta.t===P.meta.t)}}catch(e){}
  if(!live){ghMsg(`Menunggu GitHub Pages aktif (${Math.round(i*GHPOLL/1000)} detik)... biasanya 1–3 menit.`);await sleep(GHPOLL)}}
 return live}

 const ck=(ok,t)=>`<li class="${ok?'text-green-700':'text-amber-700'}">${ok?'✓':'⚠'} ${t}</li>`;
 return `<div class="card border-l-4" style="border-left-color:${thc(l)}"><div class="font-bold mb-2"><i class="fa fa-share-nodes mr-1"></i>Bagikan link ujian KELAS ${esc(l)}</div><input readonly class="inp font-mono text-xs" value="${esc(u)}" onclick="this.select()">
 <div class="flex flex-wrap gap-2 mt-2"><button class="btn" style="background:#16a34a" onclick="waShare('${l}')"><i class="fa-brands fa-whatsapp mr-1"></i>Kirim ke WhatsApp</button><button class="btn2" onclick="cpLink('${l}',this)"><i class="fa fa-copy mr-1"></i>Salin link</button><a class="btn2" href="${esc(u)}" target="_blank" rel="noopener"><i class="fa fa-arrow-up-right-from-square mr-1"></i>Uji buka</a>${navigator.share?`<button class="btn2" onclick="nShare('${l}')"><i class="fa fa-share mr-1"></i>Bagikan...</button>`:''}${cfgOn()||ghOn()?'':`<button class="btn2" onclick="dlData()"><i class="fa fa-download mr-1"></i>Unduh data.json</button>`}</div>
 <ul class="text-xs mt-2 space-y-0.5">${ck(pb,pb?'Soal sudah dipublikasikan':'Belum dipublikasikan: klik tombol Publikasikan di atas')}${ck(!!(ghOn()&&S.cfg.gh.last)||cfgOn(),(ghOn()&&S.cfg.gh.last)||cfgOn()?'Data ujian sudah di internet: peserta bisa login dari HP':'Akun GitHub belum terhubung: buka Pengaturan lalu klik Publikasikan')}${ck(cfgOn(),cfgOn()?'Firebase aktif: nilai peserta tampil di Monitoring':'Nilai peserta belum tampil di Monitoring (opsional: aktifkan Firebase di Pengaturan)')}</ul></div>`}

/* --- Daftar & detail KELAS --- */
function lvListV(){const Ls=levels();
 return `<div class="card mb-4 flex gap-2 items-end flex-wrap"><div><label class="lbl">Tambah KELAS baru (angka jenjang)</label><input id="nl" class="inp" placeholder="contoh: 9" onkeydown="if(event.key=='Enter')addLv()"></div><button class="btn" onclick="addLv()"><i class="fa fa-plus mr-1"></i>Tambah KELAS</button></div><div class="grid lg:grid-cols-2 gap-4 mb-6">${Ls.map(shareV).join('')}</div>
 <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${Ls.length?Ls.map(l=>{const cs=S.classes.filter(c=>lvl(c.name)==l),n=S.exams.filter(e=>e.lvl==l).length;return `<div class="card border-t-4" style="border-top-color:${thc(l)}"><div class="flex items-center gap-2"><span class="w-4 h-4 rounded-full" style="background:${thc(l)}"></span><b class="text-lg">KELAS ${esc(l)}</b></div><p class="text-sm text-slate-500 mt-1">Kelas peserta: ${cs.map(c=>c.name).join(', ')||'-'}<br>${cs.reduce((a,c)=>a+c.students.length,0)} peserta · ${n} ujian</p><div class="mt-3 flex gap-2"><button class="btn" onclick="L='${l}';sub='peserta';eid=null;draw()">Buka</button><button class="btn2 text-red-600" onclick="delLv('${l}')"><i class="fa fa-trash"></i></button></div></div>`}).join(''):'<div class="card text-center text-slate-500 py-10 sm:col-span-3">Belum ada KELAS. Tambahkan KELAS pertama (misalnya 9).</div>'}</div>`}
function addLv(){const v=$('#nl').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!v)return;S.lv=S.lv||[];if(!S.lv.includes(v))S.lv.push(v);sv();draw()}
function delLv(l){if(!confirm('Hapus KELAS '+l+' beserta seluruh kelas peserta dan ujiannya?'))return;S.classes=S.classes.filter(c=>lvl(c.name)!=l);S.exams=S.exams.filter(e=>e.lvl!=l);S.lv=(S.lv||[]).filter(x=>x!=l);sv();draw()}
function lvV(){const tabs=[['peserta','Peserta','fa-users'],['ujian','Jadwal & Soal','fa-file-pen'],['mon','Monitoring','fa-chart-line'],['tema','Warna & Info','fa-palette']];
 return `<div class="flex items-center gap-3 mb-3 flex-wrap"><button class="btn2" onclick="L=null;eid=null;draw()"><i class="fa fa-arrow-left mr-1"></i>Semua KELAS</button><h2 class="text-xl font-extrabold flex items-center gap-2"><span class="w-4 h-4 rounded-full" style="background:${thc(L)}"></span>KELAS ${esc(L)}</h2></div>${sub=='mon'?'':`<div class="mb-4">${shareV(L)}</div>`}
 <div class="flex gap-1 mb-4 overflow-x-auto">${tabs.map(([k,n,i])=>`<button onclick="sub='${k}';eid=null;draw()" class="px-4 py-2 text-sm font-semibold rounded-lg whitespace-nowrap ${sub==k?'bg-indigo-600 text-white':'bg-white border'}"><i class="fa ${i} mr-1"></i>${n}</button>`).join('')}</div>${sub=='peserta'?pesV():sub=='ujian'?ujianV():sub=='mon'?monV():temaV()}`}

/* --- Peserta per kelas --- */
function pesV(){const cs=S.classes.filter(c=>lvl(c.name)==L);
 return `<div class="grid lg:grid-cols-3 gap-4"><div class="card self-start space-y-3"><h3 class="font-bold">Tambah peserta kelas</h3>
 <div><label class="lbl">Kelas peserta (huruf/angka setelah ${esc(L)})</label><div class="flex items-center gap-2"><b>${esc(L)}</b><input id="cn" class="inp" placeholder="A, B, C, D ..." maxlength="4"></div></div>
 <div><label class="lbl">Ketik nama peserta (satu per baris)</label><textarea id="ct" class="inp" rows="4" placeholder="Ani Lestari&#10;Budi Santoso;7A11050;rahasia1"></textarea><p class="text-xs text-slate-500 mt-1">Cukup nama: nomor dan password dibuat otomatis oleh sistem. Atau manual dengan format <b>Nama;Nomor;Password</b> (bagian yang kosong tetap dibuat otomatis).</p></div>
 <div><label class="lbl">atau unggah absen Excel (.xlsx / .xls). Kolom opsional: Nama, Nomor Peserta, Password</label><input id="cf" type="file" accept=".xlsx,.xls" class="inp"></div>
 <button class="btn w-full" onclick="imp()"><i class="fa fa-user-plus mr-1"></i>Tambah peserta</button><button class="btn2 w-full" onclick="renumber()"><i class="fa fa-arrow-down-1-9"></i>Nomori ulang (format baru)</button><p class="text-xs text-slate-500">Jika kelas sudah ada, peserta baru ditambahkan di urutan berikutnya. Nomor peserta berformat kelas + bulan + urutan (contoh ${esc(L)}A11001), urutannya berlanjut antar kelas di KELAS ${esc(L)}. Password dibuat otomatis. Nomor dan password juga bisa diubah manual langsung di tabel peserta; tombol # dan kunci mengembalikannya ke buatan sistem.</p></div>
 <div class="lg:col-span-2 space-y-4">${cs.length?cs.map(c=>{const ci=S.classes.indexOf(c);return `<div class="card"><div class="flex justify-between items-center mb-2 flex-wrap gap-2"><b>Kelas ${esc(c.name)} · ${c.students.length} peserta</b><span class="flex gap-1 flex-wrap"><button class="btn2" onclick="addOne(${ci})"><i class="fa fa-plus"></i> Peserta</button><button class="btn2" onclick="rspAll(${ci})"><i class="fa fa-key"></i> Password otomatis semua</button><button class="btn2" onclick="kartu(${ci})"><i class="fa fa-print"></i> Kartu</button><button class="btn2" onclick="expCls(${ci})"><i class="fa fa-file-excel"></i> Excel</button><button class="btn2 text-red-600" onclick="delC(${ci})"><i class="fa fa-trash"></i></button></span></div>
 <div class="overflow-auto max-h-80 rounded-xl border border-slate-200"><table class="w-full stk"><tr><th>No. Peserta</th><th>Nama</th><th>Password</th><th></th></tr>${c.students.map((s,k)=>`<tr><td><input class="inp font-mono text-xs" style="padding:6px 10px;min-width:118px" value="${esc(s.no)}" onchange="chgNo(${ci},${k},this)"></td><td><input class="inp" style="padding:6px 10px;min-width:150px" value="${esc(s.name)}" onchange="S.classes[${ci}].students[${k}].name=this.value;sv()"></td><td><input class="inp font-mono text-xs" style="padding:6px 10px;min-width:110px" value="${esc(s.pass)}" onchange="chgPw(${ci},${k},this)"></td><td class="whitespace-nowrap"><button title="Nomor otomatis dari sistem" class="px-1.5 text-slate-600" onclick="autoNo(${ci},${k})"><i class="fa fa-hashtag"></i></button><button title="Password otomatis dari sistem" class="px-1.5 text-slate-600" onclick="rsp(${ci},${k})"><i class="fa fa-key"></i></button><button title="Hapus" class="px-1.5 text-red-500" onclick="delS(${ci},${k})"><i class="fa fa-xmark"></i></button></td></tr>`).join('')}</table></div></div>`}).join(''):'<div class="card text-center text-slate-500 py-10">Belum ada kelas peserta. Tambahkan kelas (misalnya A) dan nama peserta di panel kiri.</div>'}</div></div>`}
const newPass=(name,used)=>{let p;do{p=name+(Math.floor(Math.random()*9000)+1000)+'#'}while(used.has(p));used.add(p);return p};
const usedP=()=>new Set(S.classes.flatMap(k=>k.students.map(s=>s.pass)));
const seqOf=(no,cn)=>{const t=String(no).slice(cn.length);return t.length>=5?+t.slice(2)||0:+t||0};
const mm2=()=>String(new Date().getMonth()+1).padStart(2,'0');
const numTaken=no=>S.classes.some(k=>k.students.some(s=>s.no==no));
const cleanNo=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function nextNo(cname){const mm=mm2();let n=S.classes.filter(k=>lvl(k.name)==lvl(cname)).reduce((m,k)=>k.students.reduce((q,s)=>Math.max(q,seqOf(s.no,k.name)),m),0),no;do{n++;no=cname+mm+String(n).padStart(3,'0')}while(numTaken(no));return no}
function addStud(name,items){let c=S.classes.find(x=>x.name==name);if(!c){c={name,students:[]};S.classes.push(c)}
 const used=usedP();let bad=0;
 items.forEach(it=>{it=typeof it=='string'?{nm:it}:it;let no=cleanNo(it.no);if(no&&numTaken(no)){bad++;no=''}if(!no)no=nextNo(name);c.students.push({no,name:it.nm,pass:String(it.pass||'').trim()||newPass(name,used)})});
 sv();draw();if(bad)alert(bad+' nomor peserta manual sudah dipakai, jadi dibuat otomatis oleh sistem.')}
function chgNo(ci,k,el){const s=S.classes[ci].students[k],v=cleanNo(el.value);
 if(!v){el.value=s.no;return alert('Nomor peserta tidak boleh kosong.')}
 if(v!==s.no&&numTaken(v)){el.value=s.no;return alert('Nomor peserta '+v+' sudah dipakai peserta lain.')}
 s.no=v;el.value=v;sv();toast('Nomor peserta diubah. Klik Publikasikan.')}
function chgPw(ci,k,el){const s=S.classes[ci].students[k],v=el.value.trim();
 if(!v){el.value=s.pass;return alert('Password tidak boleh kosong.')}
 s.pass=v;sv();toast('Password diubah. Klik Publikasikan.')}
function autoNo(ci,k){const c=S.classes[ci];c.students[k].no=nextNo(c.name);sv();draw();toast('Nomor peserta dari sistem dipakai. Klik Publikasikan.')}
function rspAll(ci){const c=S.classes[ci];if(!confirm('Buat ulang password SEMUA peserta kelas '+c.name+' secara otomatis? Kartu peserta harus dicetak ulang.'))return;const used=usedP();c.students.forEach(s=>{s.pass=newPass(c.name,used)});sv();draw();toast('Password baru dibuat. Klik Publikasikan.')}
function renumber(){if(!confirm('Semua nomor peserta KELAS '+L+' akan diganti ke format baru (kelas + bulan + urutan berlanjut antar kelas). Password tetap. Kartu peserta harus dicetak ulang dan hasil ujian lama tidak lagi cocok. Lanjutkan?'))return;
 let n=0;const mm=mm2();S.classes.filter(c=>lvl(c.name)==L).sort((x,y)=>x.name.localeCompare(y.name)).forEach(c=>c.students.forEach(s=>{n++;s.no=c.name+mm+String(n).padStart(3,'0')}));sv();draw();toast('✓ Nomor peserta diperbarui. Klik Publikasikan.')}
function imp(){const sfx=$('#cn').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,''),f=$('#cf').files[0];
 const items=$('#ct').value.split('\n').map(x=>x.trim()).filter(Boolean).map(l=>{const p=l.split(/;|\t/).map(x=>x.trim());return{nm:p[0],no:p[1]||'',pass:p[2]||''}}).filter(x=>x.nm);
 if(!sfx)return alert('Isi nama kelas peserta, misalnya A.');
 const go=()=>items.length?addStud(L+sfx,items):alert('Tidak ada nama peserta yang terbaca.');
 if(!f)return go();
 const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}),hd=(rows[0]||[]).map(x=>String(x==null?'':x).toLowerCase()),ni=hd.findIndex(x=>/nama/.test(x)),oi=hd.findIndex(x=>/(nomor|no\.?)\s*peserta/.test(x)),pi=hd.findIndex(x=>/(pass|sandi)/.test(x));
  if(ni>=0)rows.slice(1).forEach(r=>{const nm=String((r||[])[ni]==null?'':r[ni]).trim();if(nm)items.push({nm,no:oi>=0&&r[oi]!=null?String(r[oi]).trim():'',pass:pi>=0&&r[pi]!=null?String(r[pi]).trim():''})});
  else rows.forEach(r=>{const c=(r||[]).find(x=>typeof x=='string'&&x.trim()&&isNaN(x));if(c&&!/^(nama( siswa| peserta| lengkap)?|no\.?|absen)$/i.test(c.trim()))items.push({nm:c.trim()})});
  go()};r.readAsArrayBuffer(f)}
function addOne(ci){const n=prompt('Nama peserta baru:');if(n&&n.trim())addStud(S.classes[ci].name,[n.trim()])}
function rsp(ci,k){S.classes[ci].students[k].pass=newPass(S.classes[ci].name,usedP());sv();draw()}
function delS(ci,k){if(confirm('Hapus peserta ini?')){S.classes[ci].students.splice(k,1);sv();draw()}}
function delC(ci){if(confirm('Hapus kelas peserta '+S.classes[ci].name+'?')){S.classes.splice(ci,1);sv();draw()}}
function expCls(i){const c=S.classes[i],ws=XLSX.utils.json_to_sheet(c.students.map((s,k)=>({Absen:k+1,Nama:s.name,'No. Peserta':s.no,Password:s.pass}))),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,c.name);XLSX.writeFile(wb,`Kartu_Login_${c.name}.xlsx`)}
function kartu(i){const c=S.classes[i],w=window.open('','_blank');if(!w)return alert('Izinkan pop-up untuk mencetak kartu.');
 w.document.write(`<html><head><title>Kartu Peserta ${esc(c.name)}</title><style>body{font-family:sans-serif}.k{display:inline-block;width:46%;border:1px solid #333;margin:6px;padding:10px;border-radius:8px;page-break-inside:avoid;font-size:13px}</style></head><body>${c.students.map(s=>`<div class="k"><b>${esc(S.inst.name)}</b><br>EXAM CBT.PLUS · Kelas ${esc(c.name)}<hr>Nama: ${esc(s.name)}<br>No. Peserta: <b>${s.no}</b><br>Password: <b>${esc(s.pass)}</b></div>`).join('')}</body></html>`);w.document.close();w.print()}

/* --- Pengaturan umum --- */
function setV(){const vol=(S.siren&&S.siren.vol!=null)?S.siren.vol:100,c=S.cfg=S.cfg||{},g=c.gh=c.gh||{},host=/^https?:/.test(location.protocol),hasSrc=!!localStorage.getItem('cbt_src');
 const tokenUrl='https://github.com/settings/tokens/new?scopes=repo&description='+encodeURIComponent('EXAM CBT.PLUS');
 return `<div class="grid md:grid-cols-2 gap-4">
 <div class="card space-y-3 md:col-span-2 border-l-4 border-indigo-500"><h3 class="font-bold text-lg"><i class="fa-brands fa-github mr-1"></i>Akun online (GitHub)</h3>
 <p class="text-sm text-slate-600">Isi sekali, lalu klik <b>Publikasikan</b>. Sistem otomatis membuat repository, mengunggah aplikasi dan data ujian, mengaktifkan GitHub Pages, lalu link ujian siap dibagikan ke peserta.</p>
 <ol class="list-decimal pl-5 text-sm text-slate-600 space-y-1"><li>Siapkan akun gratis di github.com (disarankan akun khusus sekolah).</li><li>Klik <a class="btn2" href="${tokenUrl}" target="_blank" rel="noopener"><i class="fa fa-key mr-1"></i>Buat token</a> → di halaman GitHub pilih Expiration <b>No expiration</b>, gulir ke bawah, klik <b>Generate token</b>, lalu salin token (awalan <i>ghp_</i>).</li><li>Tempel token di bawah, lalu klik <b>Publikasikan</b>.</li></ol>
 <div class="grid md:grid-cols-2 gap-3"><div><label class="lbl">Token GitHub</label><input type="password" class="inp font-mono" placeholder="ghp_..." value="${esc(g.token||'')}" oninput="S.cfg.gh.token=this.value.trim();sv()"></div>
 <div><label class="lbl">Nama repository (otomatis dari nama sekolah)</label><input class="inp font-mono" value="${esc(g.repo||slug())}" onchange="S.cfg.gh.repo=this.value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');sv();draw()"></div></div>
 <div class="rounded-xl border border-slate-200 p-3 space-y-2"><div class="font-semibold text-sm"><i class="fa fa-code-branch mr-1"></i>Versi aplikasi</div><p class="text-xs text-slate-600">Versi file ini: <b>${APP_VER}</b>. Setiap menerima <b>index.html baru</b> dari saya, pilih file itu di sini. File langsung diunggah ke GitHub dan dicek sampai tayang.</p>
 <div class="flex flex-wrap gap-2"><label class="btn2 cursor-pointer"><i class="fa fa-upload"></i>Pilih index.html terbaru &amp; perbarui<input type="file" accept=".html" hidden onchange="updAppFile(this)"></label><button class="btn2" onclick="checkRemote()"><i class="fa fa-magnifying-glass"></i>Cek versi di internet</button></div></div>

 <p class="text-xs text-slate-500">Token disimpan hanya di browser ini. Repository bersifat publik: nama peserta, soal, dan kunci dapat dilihat orang yang tahu alamatnya. Nilai peserta belum tampil di Monitoring kecuali Firebase (opsional, di bawah) diaktifkan.</p></div>
 <details class="card md:col-span-2"><summary class="font-bold cursor-pointer"><i class="fa fa-chart-line mr-1"></i>Opsional: pantau nilai peserta langsung (Firebase)</summary><div class="space-y-3 mt-3">
 <p class="text-sm text-slate-600">Tanpa ini, jawaban dan nilai peserta tersimpan di perangkat peserta. Dengan Firebase, hasil muncul langsung di tab Monitoring dan data admin dapat dibuka di perangkat lain.</p>
 <ol class="list-decimal pl-5 text-sm text-slate-600 space-y-1"><li>Buka <b>console.firebase.google.com</b>, login Google, klik <b>Create a project</b>.</li><li><b>Build → Firestore Database → Create database</b> → <b>Start in test mode</b>.</li><li>Tab <b>Rules</b>: tempel aturan di bawah, klik <b>Publish</b>.</li><li><b>Project settings → General → Your apps</b> → ikon web <b>&lt;/&gt;</b> → Register app → salin blok <b>firebaseConfig</b>.</li><li>Tempel di kotak bawah, klik <b>Baca konfigurasi</b>, lalu <b>Tes koneksi</b>.</li></ol>

const RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{document=**} {\n      allow read, write: if true;\n    }\n  }\n}";
function cloudHint(m){m=String(m||'');
 if(/API key not valid|API_KEY_INVALID/i.test(m))return 'API Key salah. Salin ulang apiKey dari Firebase.';
 if(/PERMISSION_DENIED|Missing or insufficient/i.test(m))return 'Aturan (Rules) Firestore belum benar. Tempel aturan dari panduan lalu klik Publish.';
 if(/NOT_FOUND|does not exist|has not been used|disabled/i.test(m))return 'Database Firestore belum dibuat atau Project ID salah. Buat di Build → Firestore Database → Create database.';
 if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Tidak bisa terhubung ke internet.';
 return m}
function parseCfg(t){const g=k=>(t.match(new RegExp(k+'\\s*[:=]\\s*["\']([^"\']+)["\']'))||[])[1];let o={key:g('apiKey'),pid:g('projectId')};
 if(!o.key||!o.pid)try{const j=JSON.parse(t);o={key:j.apiKey,pid:j.projectId}}catch(e){}return o}
function pasteCfg(){const o=parseCfg($('#pcf').value);if(!o.key||!o.pid)return alert('Konfigurasi tidak terbaca. Salin seluruh blok firebaseConfig dari Firebase (harus memuat apiKey dan projectId).');S.cfg.pid=o.pid;S.cfg.key=o.key;sv();draw();toast('✓ Konfigurasi terbaca. Klik Tes koneksi.')}
async function testCloud(){const t=$('#tc');t.textContent='Menguji...';t.className='text-sm';if(!cfgOn()){t.textContent='Isi Project ID dan Web API Key dulu.';t.className='text-sm text-red-600';return}
 try{await cput('pub','ping',{t:Date.now()});t.textContent='✓ Terhubung. Sekarang klik Publikasikan.';t.className='text-sm text-green-600'}catch(e){t.textContent='Gagal: '+cloudHint(e.message);t.className='text-sm text-red-600'}}
async function pushAdmin(){const{exams,cfg,...core}=S;core.acc=ld(ACC,null);await cput('adm','core',core);for(const e of exams)await cput('adm','ex_'+e.id,e);await cput('adm','idx',{ids:exams.map(e=>e.id),t:Date.now()})}
async function pullAdmin(){const idx=await cget('adm','idx');if(!idx)throw new Error('Belum ada data admin online. Klik Publikasikan atau Simpan data admin di perangkat utama dulu.');
 const core=await cget('adm','core'),exams=[];for(const id of idx.ids){const e=await cget('adm','ex_'+id);if(e)exams.push(e)}
 const cfg=S.cfg;if(core.acc)localStorage.setItem(ACC,JSON.stringify(core.acc));delete core.acc;S=Object.assign({inst:{name:'',logo:''},lv:[],themes:{},ann:{},classes:[]},core,{exams,cfg});sv()}
async function saveAdm(){const t=$('#tc');if(!cfgOn()){t.textContent='Isi Project ID dan Web API Key dulu.';t.className='text-sm text-red-600';return}t.textContent='Menyimpan...';try{await pushAdmin();t.textContent='✓ Data admin tersimpan online.';t.className='text-sm text-green-600'}catch(e){t.textContent='Gagal: '+cloudHint(e.message);t.className='text-sm text-red-600'}}
async function loadAdm(){if(!cfgOn())return alert('Isi Project ID dan Web API Key dulu.');if(!confirm('Data admin di perangkat ini akan diganti dengan data dari online. Lanjutkan?'))return;try{await pullAdmin();draw();toast('✓ Data admin dimuat dari online')}catch(e){alert('Gagal: '+cloudHint(e.message))}}
async function connectAdm(){const o=parseCfg($('#acf').value);if(!o.key||!o.pid)return alert('Konfigurasi tidak terbaca. Salin seluruh blok firebaseConfig dari Firebase.');S.cfg.pid=o.pid;S.cfg.key=o.key;sv();try{await pullAdmin();toast('✓ Data dan akun admin dimuat');authV()}catch(e){alert('Gagal: '+cloudHint(e.message))}}
function bak(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({S,R:rs()})],{type:'application/json'}));a.download='Backup_EXAM_CBT_PLUS.json';a.click()}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const o=JSON.parse(e.target.result);if(!o.S)throw 0;if(!confirm('Data saat ini akan diganti. Lanjutkan?'))return;S=Object.assign(S,o.S);localStorage.setItem(R,JSON.stringify(o.R||{}));sv();draw();toast('Data berhasil dipulihkan')}catch(x){alert('File cadangan tidak valid.')}};r.readAsText(f)}

 <div class="card mb-4"><h3 class="font-bold mb-3">Jadwal, durasi & keamanan</h3><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
 ${f('Mata pelajaran','subject')}
 <div><label class="lbl">Kelas peserta (opsional)</label><select class="inp" onchange="e_('cls',this.value)"><option value="">Semua kelas KELAS ${esc(L)}</option>${S.classes.filter(c=>lvl(c.name)==L).map(c=>`<option ${e.cls==c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 ${f('Tanggal ujian','date','date')}${f('Jam mulai','start','time')}${f('Jam selesai','end','time')}
 ${f('Durasi ujian (menit)','dur','number','min=1')}${f('Minimal waktu sebelum boleh selesai (menit)','min','number','min=0')}${f('Maks. pelanggaran pindah tab','maxV','number','min=1')}
 ${f('Token ujian (opsional)','token','text','placeholder="kosongkan jika tanpa token"')}
 <div><label class="lbl">Mode poin</label><select class="inp" onchange="e_('ptsMode',this.value)"><option value="auto">Otomatis (bobot sama)</option><option value="manual" ${e.ptsMode=='manual'?'selected':''}>Manual (poin per soal)</option></select></div>

 <div><label class="lbl">Anti copy / paste</label><select class="inp" onchange="e_('noCopy',this.value=='1')"><option value="1">Aktif</option><option value="0" ${e.noCopy===false?'selected':''}>Nonaktif</option></select></div></div></div>

 ${e.pub?`<div class="mt-3">${shareV(L)}</div>`:''}</div>`}
function e_(k,v,t){cur()[k]=t=='number'?+v:v;sv()}
function newE(){const e={id:uid(),subject:'',lvl:L,cls:'',date:new Date().toISOString().slice(0,10),start:'07:30',end:'09:30',dur:90,min:45,maxV:5,ptsMode:'auto',showRes:false,noCopy:true,token:'',qs:[],pub:false};S.exams.push(e);eid=e.id;qi=0;sv();draw()}
function dupE(id){const o=S.exams.find(e=>e.id==id),e=JSON.parse(JSON.stringify(o));e.id=uid();e.subject+=' (salinan)';e.pub=false;S.exams.push(e);sv();draw()}
function delE(id){if(confirm('Hapus ujian ini?')){S.exams=S.exams.filter(e=>e.id!=id);sv();draw()}}
async function fin(){
 const e=cur();if(!e.subject||!e.qs.length)return alert('Lengkapi mata pelajaran dan minimal satu soal.');
 if(e.start>=e.end)return alert('Jam selesai harus setelah jam mulai.');
 const bad=e.qs.findIndex(q=>!q.q.trim()&&!q.img||(q.t=='pg'||q.t=='pgk')&&(q.o.some((o,i)=>!o.trim()&&!(q.oi&&q.oi[i]))||q.t=='pgk'&&!q.k.length)||q.t=='match'&&(q.O.length<2||q.O.some((o,i)=>!o.trim()&&!(q.oi&&q.oi[i]))||!q.L.length||q.L.some(x=>!x.s.trim()||x.k>=q.O.length))||q.t=='tf'&&q.i.some(x=>!x.s.trim()));
 if(bad>=0){qi=bad;draw();return alert('Soal nomor '+(bad+1)+' belum lengkap.')}
 e.pub=true;sv();await publish()}

/* --- Editor soal --- */
function newQ(t){const b={t,q:'',pts:1};
 if(t=='pg')return{...b,o:['','','',''],k:0};if(t=='pgk')return{...b,o:['','','',''],k:[]};
 if(t=='match')return{...b,O:['',''],L:[{s:'',k:0},{s:'',k:0}]};if(t=='tf')return{...b,i:[{s:'',v:true},{s:'',v:false}]};if(t=='isian')return{...b,ans:''};return{...b,kw:''}}
function qEd(){
 const q=Q();if(!q)return '<p class="text-center text-slate-400 py-6">Belum ada slide soal. Klik “Slide” untuk menambah.</p>';
 let h=`<div class="flex gap-2"><select class="inp" onchange="chT(this.value)">${Object.entries(T).map(([k,v])=>`<option value="${k}" ${q.t==k?'selected':''}>${v}</option>`).join('')}</select><button class="btn2 text-red-600" onclick="cur().qs.splice(qi,1);qi=Math.max(0,qi-1);sv();draw()"><i class="fa fa-trash"></i></button></div>
 <textarea class="inp mt-2" rows="3" placeholder="Tulis pertanyaan atau instruksi" oninput="Q().q=this.value;sv()">${esc(q.q)}</textarea>`+imgC(null)+`<div class="mt-2 w-44"><label class="lbl">Poin soal (mode manual)</label><input type="number" min="0" step="0.5" class="inp" value="${q.pts??1}" oninput="Q().pts=+this.value;sv()"></div>`;
 if(q.t=='pg'||q.t=='pgk')h+=`<p class="text-xs text-slate-500 mt-3">Tandai ${q.t=='pg'?'satu':'semua'} jawaban yang benar.</p>`+q.o.map((o,i)=>`<div class="mt-2"><div class="flex gap-2 items-center"><input type="${q.t=='pg'?'radio':'checkbox'}" name="k" ${(q.t=='pg'?q.k===i:q.k.includes(i))?'checked':''} onchange="setK(${i},this.checked)"><b class="w-5">${'ABCDEFGH'[i]}</b><input class="inp" value="${esc(o)}" oninput="Q().o[${i}]=this.value;sv()"><button class="text-red-500 px-2" onclick="delO(${i})"><i class="fa fa-xmark"></i></button></div>${imgC(i)}</div>`).join('')+(q.o.length<8?`<button class="btn2 mt-2" onclick="Q().o.push('');sv();draw()">+ Opsi</button>`:'');
 if(q.t=='match')h+=`<div class="grid md:grid-cols-2 gap-4 mt-3"><div><label class="lbl">1. Daftar pilihan jawaban (tambahkan pengecoh agar tidak bisa ditebak)</label>${q.O.map((o,i)=>`<div class="mt-2"><div class="flex gap-2 items-center"><b class="w-5">${i+1}</b><input class="inp" value="${esc(o)}" oninput="Q().O[${i}]=this.value;sv()" onchange="draw()"><button class="text-red-500 px-2" onclick="delM(${i})"><i class="fa fa-xmark"></i></button></div>${imgC(i)}</div>`).join('')}<button class="btn2 mt-2" onclick="Q().O.push('');sv();draw()">+ Pilihan</button></div>
 <div><label class="lbl">2. Pernyataan dan kunci jawabannya</label>${q.L.map((x,i)=>`<div class="flex gap-2 mt-2"><input class="inp" placeholder="Pernyataan" value="${esc(x.s)}" oninput="Q().L[${i}].s=this.value;sv()"><select class="inp w-40" onchange="Q().L[${i}].k=+this.value;sv()">${q.O.map((o,j)=>`<option value="${j}" ${x.k==j?'selected':''}>${j+1}. ${esc(o).slice(0,22)}</option>`).join('')}</select><button class="text-red-500 px-2" onclick="Q().L.splice(${i},1);sv();draw()"><i class="fa fa-xmark"></i></button></div>`).join('')}<button class="btn2 mt-2" onclick="Q().L.push({s:'',k:0});sv();draw()">+ Pernyataan</button></div></div>`;
 if(q.t=='tf')h+=q.i.map((x,i)=>`<div class="flex gap-2 mt-2"><input class="inp" placeholder="Pernyataan" value="${esc(x.s)}" oninput="Q().i[${i}].s=this.value;sv()"><select class="inp w-32" onchange="Q().i[${i}].v=this.value=='1';sv()"><option value="1" ${x.v?'selected':''}>Benar</option><option value="0" ${!x.v?'selected':''}>Salah</option></select><button class="text-red-500 px-2" onclick="Q().i.splice(${i},1);sv();draw()"><i class="fa fa-xmark"></i></button></div>`).join('')+`<button class="btn2 mt-2" onclick="Q().i.push({s:'',v:true});sv();draw()">+ Pernyataan</button>`;
 if(q.t=='isian')h+=`<div class="mt-3"><label class="lbl">Kunci jawaban (opsional)</label><input class="inp" value="${esc(q.ans||'')}" placeholder="contoh: Jakarta; DKI Jakarta" oninput="Q().ans=this.value;sv()"><p class="text-xs text-slate-500 mt-1">Pisahkan dengan titik koma (;) jika ada beberapa jawaban yang diterima. Huruf besar/kecil diabaikan; angka 0,5 dan 0.5 dianggap sama. Kosongkan jika tidak dinilai otomatis; isian tanpa kunci tidak dihitung dalam nilai.</p></div>`;
 if(q.t=='essay')h+=`<div class="mt-3"><label class="lbl">Kunci jawaban: kata kunci (opsional, pisahkan dengan koma)</label><input class="inp" value="${esc(q.kw)}" placeholder="fotosintesis, klorofil, cahaya matahari" oninput="Q().kw=this.value;sv()"><p class="text-xs text-slate-500 mt-1">Isi untuk koreksi otomatis berdasarkan kecocokan kata kunci. Kosongkan jika essay tidak dinilai otomatis; essay tanpa kata kunci tidak dihitung dalam nilai.</p></div>`;
 return h}
function setK(i,c){const q=Q();if(q.t=='pg')q.k=i;else q.k=c?[...new Set([...q.k,i])]:q.k.filter(x=>x!=i);sv()}
function delO(i){const q=Q();if(q.o.length<=2)return;q.o.splice(i,1);q.oi&&q.oi.splice(i,1);q.k=q.t=='pg'?(q.k==i?0:q.k>i?q.k-1:q.k):q.k.filter(x=>x!=i).map(x=>x>i?x-1:x);sv();draw()}
function delM(i){const q=Q();if(q.O.length<=2)return;q.O.splice(i,1);q.oi&&q.oi.splice(i,1);q.L.forEach(x=>{x.k=x.k==i?0:x.k>i?x.k-1:x.k});sv();draw()}
function imgC(i){const q=Q(),src=i==null?q.img:(q.oi||[])[i];
 return `<div class="flex items-center gap-2 mt-2">${src?`<img src="${src}" class="h-16 rounded border"><button class="text-red-500 text-xs" onclick="rmI(${i})">Hapus gambar</button>`:''}<label class="text-xs text-indigo-600 cursor-pointer font-semibold"><i class="fa fa-image mr-1"></i>${src?'Ganti':'Tambah'} gambar<input type="file" accept="image/*" hidden onchange="upI(${i},this)"></label></div>`}
function upI(i,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.7),q=Q();if(i==null)q.img=d;else{q.oi=q.oi||[];q.oi[i]=d}sv();draw()};im.src=e.target.result};r.readAsDataURL(f)}
function rmI(i){const q=Q();if(i==null)delete q.img;else q.oi[i]=null;sv();draw()}
function chT(v){const o=Q();cur().qs[qi]=Object.assign(newQ(v),{q:o.q,img:o.img,pts:o.pts});sv();draw()}

/* --- Impor dari Claude & AI --- */
const FMT=`Balas HANYA dengan array JSON (tanpa teks lain). Setiap elemen salah satu bentuk:
{"t":"pg","q":"pertanyaan","o":["A","B","C","D"],"k":0}  (k = nomor indeks jawaban benar, mulai 0)
{"t":"pgk","q":"..","o":["opsi1","opsi2","opsi3","opsi4"],"k":[0,2]}
{"t":"match","q":"..","O":["pilihan jawaban termasuk 1-2 pengecoh"],"L":[{"s":"pernyataan","k":0}]}  (k = indeks di O)
{"t":"tf","q":"..","i":[{"s":"pernyataan","v":true}]}
{"t":"isian","q":"..","ans":"jawaban1; jawaban2"}  (ans boleh dikosongkan)
{"t":"essay","q":"..","kw":"kata1, kata2, kata3"}  (kw boleh dikosongkan)`;
function normQ(x){if(!x||!T[x.t]||!x.q)return null;const q=newQ(x.t);q.q=String(x.q);

 return `<div class="rounded-xl bg-slate-50 p-3 mt-3 text-slate-700 font-normal"><div class="text-xs text-slate-500">Nilai akhir</div><div class="text-4xl font-extrabold text-indigo-700">${res.score}</div><div class="text-xs text-slate-500">${ok} benar penuh dari ${n} soal</div><div class="flex flex-wrap gap-1 justify-center mt-2">${chips}</div><div class="text-[10px] text-slate-400 mt-1">Hijau benar · kuning sebagian · merah salah · abu belum dinilai</div></div>`}
const rx=()=>ex.showRes?resH():'';
function done(){
 const el=(Date.now()-res.start)/60000;
 if(el<ex.min)return mdl('fa-hourglass-half','text-amber-500',`PERINGATAN SISTEM!<br><span class="text-base font-semibold">Anda baru bisa menyelesaikan ujian setelah ${ex.min} menit. Sisa waktu minimal ${Math.ceil(ex.min-el)} menit.</span>`,[['Kembali ke Soal',B1,'cl()']]);
 const un=ex.qs.filter((_,i)=>!ansd(i)).length,db=ex.qs.filter((_,i)=>res.dbt[i]).length;
 if(un)return mdl('fa-circle-exclamation','text-slate-400',`HEIII ${NM()} ADA ${un} SOAL YANG BELUM KAMU JAWAB, SILAHKAN CEK KEMBALI NAVIGASI SOAL YANG BERWARNA ABU`,[['Cek Kembali',B1,'cl()']]);
 if(db)return mdl('fa-triangle-exclamation','text-yellow-500',`HEIII ${NM()} ADA ${db} SOAL YANG MASIH KAMU RAGU-RAGU, SILAHKAN CEK KEMBALI NAVIGASI SOAL YANG BERWARNA KUNING`,[['Cek Kembali',B1,'cl()']]);
 mdl('fa-circle-check','text-green-500',`APAKAH ANDA SUDAH SELESAI DAN APAKAH SUDAH YAKIN DENGAN JAWABAN ANDA?<br><span class="text-sm font-semibold text-slate-500">Jika sudah, silakan klik tombol centang untuk Anda logout.</span>`,[['Batalkan Logout',B2,'cl()'],['<i class="fa fa-check mr-1"></i>Tetap Logout',B1,"cl();submit('Selesai')"]])}

/* --- Anti nyontek & anti copy --- */
function stopS(){clearTimeout(SP);try{speechSynthesis.cancel()}catch(e){}}
const sirenVol=()=>{const v=(STU&&P&&P.sirenVol!=null)?P.sirenVol:(S.siren&&S.siren.vol!=null?S.siren.vol:100);return Math.max(0,Math.min(100,+v))/100};
function siren(v=1,dur=3){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();if(v<=0)return;const t=AC.currentTime,g=AC.createGain(),cp=AC.createDynamicsCompressor();g.gain.value=v;cp.threshold.value=-24;cp.knee.value=0;cp.ratio.value=12;g.connect(cp);cp.connect(AC.destination);
 [['square',1,.6],['sawtooth',1.5,.4]].forEach(([ty,k,vv])=>{const o=AC.createOscillator(),og=AC.createGain();o.type=ty;og.gain.value=vv;o.connect(og);og.connect(g);for(let i=0;i<dur*2;i++){o.frequency.setValueAtTime(600*k,t+i*.5);o.frequency.linearRampToValueAtTime(1100*k,t+i*.5+.25);o.frequency.linearRampToValueAtTime(600*k,t+i*.5+.5)}o.start(t);o.stop(t+dur)})}catch(e){}}
function say(m){stopS();SP=setTimeout(()=>{try{const u=new SpeechSynthesisUtterance(m);u.lang='id-ID';u.rate=.95;u.volume=sirenVol();speechSynthesis.speak(u)}catch(e){}},3100)}
function viol(){
 if(!run||Date.now()-lastV<1500)return;lastV=Date.now();res.viol++;sv2();siren(sirenVol());try{navigator.vibrate&&navigator.vibrate([500,200,500,200,500])}catch(e){}
 if(res.viol>=ex.maxV){submit('Diblokir',1);const m=`HEIII ${me.name.toUpperCase()} BATAS BLOKIRMU SUDAH HABIS, SILAHKAN LOGOUT DAN MENGAKHIRI UJIAN`;say(m);return mdl('fa-ban','text-red-600',esc(m)+rx(),[['Logout',B3,'lout()']],'bg-red-800/95')}
 const m=`HEIII ${me.name.toUpperCase()} SEPERTINYA KAMU TERBLOKIR SISTEM KARENA TIDAK FOKUS UJIAN`;say(m);
 mdl('fa-triangle-exclamation','text-red-600',`${esc(m)}<br><span class="text-sm font-semibold text-slate-500">Blokir ke-${res.viol} dari ${ex.maxV}. Jika batas habis, ujian berakhir.</span>`,[['Lanjutkan & Tidak Mengulangi',B1,'stopS();cl();stQ()']],'bg-red-700/95')}
